name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16

        env:
          POSTGRES_USER: devmind
          POSTGRES_PASSWORD: devmind_password
          POSTGRES_DB: devmind_test_db

        ports:
          - 5432:5432

        options: >-
          --health-cmd="pg_isready -U devmind -d devmind_test_db"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Comprobar TypeScript
        run: npm run typecheck

      - name: Ejecutar tests
        run: npm test

      - name: Compilar proyecto
        run: npm run build